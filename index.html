<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style/style.css">

</head>
<body>
    <header>
        <img src="./src/assests/image/logo.svg" alt="">
        <div class="header-navigation">
            <a href="">Home</a>
            <a href="">Produtos</a>
            <a href="">Sobre nós</a>
            <a href="">Contato</a>
        </div>

        <nav>
            <a href="" class="btn">Login</a>
        </nav>
    </header>
    
    <main>
        <img src="./src/assests/image/Computer.svg" alt="">

        <div class="details">
            <div class="star">
                <img src="./src/assests/image/Star.svg" alt="">
                <img src="./src/assests/image/Star.svg" alt="">
                <img src="./src/assests/image/Star.svg" alt="">
                <img src="./src/assests/image/Star.svg" alt="">
                <img src="./src/assests/image/Star.svg" alt="">
                <p>5.0 Estrelas <span>(21.671 avaliações)</span></p>
            </div>

            <h1>2020 Apple MacBook Pro with Apple M1 Chip (13-inch, 8GB RAM, 256GB SSD Storage) - Space Gray</h1>
            
            <div class="valor">
                <h2>R$5.299,00</h2>
                <span>R$7.000,00</span>
                <p>24,3% OFF</p>
            </div>

            <nav><a href="" class="btn-carrinho">Adicionar no carrinho</a></nav>
    
        </div>

    </main>

    <section class="page">
        
        <h2>Informações</h2>

        <nav class="forms">
    
            <form>
                <div class="container-form">
                    <div class="group">
                        <label for="text">Nome Completo:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input"/>
                    </div>
                    
                    <div class="group">
                        <label for="text">CPF:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input"/>
                    </div>

                    <div class="group">
                        <label for="text">CEP:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input"/>
                    </div>
                </div>

                <div class="container-form">
                    <div class="group">
                        <label for="text">Rua:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input"/>
                    </div>
                    
                    <div class="group">
                        <label for="text">Número:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input"/>
                    </div>

                    <div class="group">
                        <label for="text">Complemento:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9"  class="input"/>
                    </div>
                </div>
                
               <div class="container-form">
                    <div class="group">
                        <label for="text">Estado:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input"/>
                    </div>
                    
                    <div class="group">
                        <label for="text">Bairro:</label>
                        <input  type="text" id="input_cep" placeholder="" maxlength="9" required class="input" />
                    </div>

                </div>

                <button type="submit" id="btn-enviar" class="btn-enviar">Enviar</button>
            </form>
        </nav>
    </section>


</body>
</html>
